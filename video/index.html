<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Video</title>
<style>
  html, body { 
    margin: 0; 
    padding: 0; 
    background: black; 
    height: 100%;
    overflow: hidden;
  }
  video { 
    width: 100vw; 
    height: 100vh; 
    object-fit: contain;
    pointer-events: none;  /* taps go through, video can't be paused */
  }
</style>
</head>
<body>
<video autoplay muted loop playsinline disablepictureinpicture>
  <source src="video.mp4" type="video/mp4">
</video>
</body>
</html>
